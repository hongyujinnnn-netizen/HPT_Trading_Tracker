<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7AD" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#785509" />
    </linearGradient>

    <!-- Emerald Cyan Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F4A40" />
      <stop offset="50%" stop-color="#3FA88C" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagon Shield Frame -->
  <path
    d="M24 4L40 12V28L24 44L8 28V12L24 4Z"
    fill="#0A0C0E"
    stroke="url(#goldGrad)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Inset Inner Shield Border -->
  <path
    d="M24 8L36 14V26L24 38L12 26V14L24 8Z"
    fill="#131619"
    stroke="url(#goldGrad)"
    stroke-width="1"
    stroke-opacity="0.5"
  />

  <!-- Gold Ingot / Bull Horn Geometric Accent -->
  <path
    d="M17 18L24 13L31 18"
    stroke="url(#goldGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#goldGlow)"
  />

  <!-- Candlestick Wave Pulse -->
  <path
    d="M14 30L20 23L25 27L34 17"
    stroke="url(#pulseGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Arrowhead -->
  <path
    d="M30 17H34V21"
    stroke="url(#pulseGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Sparkle Dot -->
  <circle cx="34" cy="17" r="1.8" fill="#6EE7B7" />
</svg>
